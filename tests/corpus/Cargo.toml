# The regression corpus: real-world crates rbview must handle (scripts/corpus-check.py).
# Never built — only fetched, so its dependencies' sources land in the cargo registry.
# Cargo.lock pins the exact versions, so results are reproducible.
[package]
name = "rbview-corpus"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = "4"
itertools = "0.14"
proc-macro2 = "1"
quote = "1"
rayon = "1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["full"] }
