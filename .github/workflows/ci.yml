name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer, rust-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Commit range to check for attribution
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "RUBYLENS_CHECK_RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "RUBYLENS_CHECK_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "RUBYLENS_CHECK_RANGE=$(git rev-list --max-parents=0 HEAD | tail -1)..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: scripts/check.sh --full
        env:
          CI: "1"
        run: scripts/check.sh --full
